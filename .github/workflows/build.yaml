name: build
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture to force rebuild ('all' for all architectures)"
        required: false
        type: choice
        options:
          - all
          - amd64
          - arm64
          - armhf
          - s390x
          - ppc64el
          - riscv64
        default: all
      series:
        description: "Ubuntu series to force rebuild ('all' for all series)"
        required: false
        type: choice
        options:
          - all
          - bionic
          - focal
          - jammy
          - noble
          - resolute
          - stonking
        default: all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  build-image:
    strategy:
      matrix:
        arch: [amd64, arm64, armhf, s390x, ppc64el, riscv64]
        series: [bionic, focal, jammy, noble, resolute, stonking]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: armhf
            runner: ubuntu-24.04-arm
            emulate: true
          - arch: s390x
            runner: ubuntu-24.04
            emulate: true
          - arch: ppc64el
            runner: ubuntu-24.04
            emulate: true
          - arch: riscv64
            runner: ubuntu-24.04
            emulate: true
        exclude:
          - arch: riscv64
            series: bionic
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check image age
        id: check_image
        run: |
          IMAGE_TAG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${{ matrix.series }}-${{ matrix.arch }}"
          python3 check_image_age.py "${IMAGE_TAG}" \
            --series="${{ matrix.series }}" \
            --arch="${{ matrix.arch }}" \
            --event="${{ github.event_name }}" \
            --target-arch="${{ inputs.arch }}" \
            --target-series="${{ inputs.series }}"
      - name: Set up QEMU
        if: steps.check_image.outputs.skip != 'true' && matrix.emulate
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.check_image.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build and push images
        if: steps.check_image.outputs.skip != 'true'
        run: |
          IMAGE_TAG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${{ matrix.series }}-${{ matrix.arch }}"
          make build-image ARCH=${{ matrix.arch }} SERIES=${{ matrix.series }} \
            IMAGE_TAG="${IMAGE_TAG}" \
            BUILD_ARGS="--push --cache-from type=gha,scope=${{ matrix.series }}-${{ matrix.arch }} --cache-to type=gha,mode=max,scope=${{ matrix.series }}-${{ matrix.arch }}"

  build-wheels:
    needs: build-image
    strategy:
      matrix:
        arch: [amd64, arm64, armhf, s390x, ppc64el, riscv64]
        series: [bionic, focal, jammy, noble, resolute, stonking]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: armhf
            runner: ubuntu-24.04-arm
            emulate: true
          - arch: s390x
            runner: ubuntu-24.04
            emulate: true
          - arch: ppc64el
            runner: ubuntu-24.04
            emulate: true
          - arch: riscv64
            runner: ubuntu-24.04
            emulate: true
        exclude:
          - arch: riscv64
            series: bionic
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if latest version already released
        id: check
        run: |
          python3 check_package_version.py "${{ matrix.series }}" "${{ matrix.arch }}" \
            --event="${{ github.event_name }}" \
            --target-arch="${{ inputs.arch }}" \
            --target-series="${{ inputs.series }}"
      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true' && matrix.emulate
        uses: docker/setup-qemu-action@v3
      - name: Pull image
        if: steps.check.outputs.skip != 'true'
        run: |
          IMAGE_TAG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${{ matrix.series }}-${{ matrix.arch }}"
          make pull-image ARCH=${{ matrix.arch }} SERIES=${{ matrix.series }} IMAGE_TAG="${IMAGE_TAG}"
      - name: Build wheels
        if: steps.check.outputs.skip != 'true'
        run: |
          IMAGE_TAG="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${{ matrix.series }}-${{ matrix.arch }}"
          make wheel ARCH=${{ matrix.arch }} SERIES=${{ matrix.series }} IMAGE_TAG="${IMAGE_TAG}"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: wheel-${{ matrix.series }}-${{ matrix.arch }}
          path: "*.whl"

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: build-wheels
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag_name: ${{ steps.create_release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: download_artifacts
        continue-on-error: true
        with:
          pattern: 'wheel-*'
          path: dist
      - name: Create release
        id: create_release
        run: |
          if compgen -G "dist/*/*.whl" > /dev/null; then
            TAG="$(date -I)-${{ github.run_number }}"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
            gh release create "${TAG}" dist/*/*.whl --title "python-apt wheels ${TAG}"
          else
            echo "No new wheels built in this run."
          fi

  deploy-pages:
    needs: [build-wheels, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'wheel-*'
          path: dist
      - name: Generate PEP 503 static site
        run: |
          TAG="${{ needs.release.outputs.tag_name }}"
          uv run python generate_index.py dist _site "${{ github.repository }}" "${TAG}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
