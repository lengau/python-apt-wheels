name: build
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        series: [focal, jammy, noble, resolute, stonking]
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if latest version already released
        id: check
        run: |
          python3 check_package_version.py "${{ matrix.series }}" "${{ matrix.arch }}"
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build images
        if: steps.check.outputs.skip != 'true'
        run: |
          make build-image ARCH=${{ matrix.arch }} SERIES=${{ matrix.series }} \
            BUILD_ARGS="--load --cache-from type=gha,scope=${{ matrix.series }}-${{ matrix.arch }} --cache-to type=gha,mode=max,scope=${{ matrix.series }}-${{ matrix.arch }}"
      - name: Build wheels
        if: steps.check.outputs.skip != 'true'
        run: |
          make wheel ARCH=${{ matrix.arch }} SERIES=${{ matrix.series }}
      - name: Stage wheels to upload
        run: |
          mkdir -p output
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            cp existing-wheels/*.whl output/
          else
            cp *.whl output/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.series }}-${{ matrix.arch }}
          path: output/*.whl

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag_name: ${{ steps.create_release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        id: create_release
        run: |
          TAG="$(date -I)-${{ github.run_number }}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          gh release create "${TAG}" dist/*/*.whl --title "python-apt wheels ${TAG}"

  deploy-pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate PEP 503 static site
        run: |
          TAG="${{ needs.release.outputs.tag_name }}"
          uv run python generate_index.py dist _site "${{ github.repository }}" "${TAG}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
