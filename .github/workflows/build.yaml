name: build
on:
  push:
    branches:
      - main
      - feat/*

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        series: [focal, jammy, noble, resolute, stonking]
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          make build-image ARCH=${{ matrix.arch }} SERIES=${{ matrix.series }}
      - name: Build wheels
        run: |
          make wheel ARCH=${{ matrix.arch }} SERIES=${{ matrix.series }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.series }}-${{ matrix.arch }}
          path: "*.whl"

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag_name: ${{ steps.create_release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        id: create_release
        run: |
          TAG="$(date -I)-${{ github.run_number }}"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          gh release create "${TAG}" dist/*/*.whl --title "python-apt wheels ${TAG}"

  deploy-pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Generate PEP 503 static site
        run: |
          TAG="${{ needs.release.outputs.tag_name }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          uv run python generate_index.py dist _site "${RELEASE_URL}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
