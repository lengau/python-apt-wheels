name: python-apt-wheels
base: bare
build-base: ubuntu@25.10
adopt-info: wheels
summary: Wheels for python-apt
description: Wheels for python-apt
platforms: # the platforms this rock should be built on and run on
  amd64:
  arm64:
  armhf:
  ppc64el:
  riscv64:
  s390x:

# package-repositories:
#   - type: apt
#     formats: [deb, deb-src]
